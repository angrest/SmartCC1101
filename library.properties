name=SmartCC1101
version=1.0.0
author=Axel Grewe
maintainer=Axel <angrest@gmx.net>
sentence=Arduino library for the CC1101/CC1100 sub-GHz RF transceiver.
paragraph=Straightforward send/receive API with full access to the CC1101 configuration registers. Supports 868 MHz (tested) and 433/315 MHz bands, configurable modulation (2-FSK, GFSK, ASK/OOK, 4-FSK, MSK), variable and fixed packet length, CRC, Manchester encoding, data whitening, and FEC. No floating point, no printf/sprintf — safe for AVR targets.
category=Device Control
url=https://github.com/angrest/SmartCC1101
architectures=avr,esp8266,esp32
includes=SmartCC1101.h
